; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds only the firmware; the host env is for `pio test -e native`.
default_envs = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200

; Host environment for unit-testing the Arduino-free protocol core (KnxCommon + KnxValue).
; Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++14

; ---------------------------------------------------------------------------------------
; Portability envs — one per Arduino core family, compile-only, never flashed from here.
; They exist so `ci.yml` can prove the library still builds everywhere after a driver
; change. Nothing builds them by default (`default_envs` above pins the firmware env).
;
; Point them at a sketch rather than src/ when checking the examples, e.g.
;   PLATFORMIO_SRC_DIR=examples/DeviceObject pio run -e megaatmega2560
; ---------------------------------------------------------------------------------------

; AVR, classic core — the family with a free Serial1.
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; AVR, single UART — has no KNX_DEFAULT_PORT, so only the explicit-port sketch builds here.
; That is the point of the env: it proves the address-only constructor is correctly absent.
[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Renesas RA4M1 core.
[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino

; STM32duino core — a different core from the Giga's mbed one, on the same silicon vendor.
; ENABLE_HWSERIAL1 is what makes the core actually instantiate Serial1; without it the
; symbol is declared but never defined, and KNX_DEFAULT_PORT correctly stays unset.
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino
build_flags = -DENABLE_HWSERIAL1

; RP2040 with the Earle Philhower core (SerialUART : HardwareSerial). The official
; raspberrypi platform ships only the mbed core and ignores board_build.core, so this
; needs the community fork that carries both.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; A second ESP32 variant: no XIAO pin aliases, and native USB CDC on boot.
[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
