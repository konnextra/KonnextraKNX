; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; root src/ is the library itself, not firmware — `pio run` alone has no entry point to link.
; Build the bench firmware with:  PLATFORMIO_SRC_DIR=examples/BenchTest pio run
; The host env is for `pio test -e native`.
default_envs = seeed_xiao_esp32c6

; Shared by every Arduino env below (all of them build from an examples/ sketch via
; PLATFORMIO_SRC_DIR, never from root src/ itself). Flattening lib/*/src/ into root src/
; (this restructure) removed the automatic LDF discovery that used to make the library
; visible to those sketch builds — src/ is no longer under lib/, so nothing links this
; project's own root (library.properties + src/) as a library unless told to. symlink://.
; does that, anchored to the project directory itself — not a parent-directory scan, which
; would sweep in unrelated sibling projects on a real checkout.
; [env:native] clears this back to empty: it already gets src/ via test_build_src, and
; self-referencing here too would compile every .cpp twice and fail to link on duplicate
; symbols.
[env]
lib_deps = symlink://.

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200

; Second bench board (Reichelt DEBO JT ESP32 / NodeMCU-32S, ESP32-WROOM-32). Flashed by hand
; for the Step 5 hardware retest, not by CI. examples/BenchTest/BenchTest.ino builds here —
; its setPins() call is already guarded by #if defined(ARDUINO_XIAO_ESP32C6), so no manual edit
; is needed on this variant. D6/D7 are XIAO aliases and do not exist here; UART1 falls back to
; the core's own defaults, RX = GPIO 26 and TX = GPIO 27.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

; Third bench board (ST Nucleo-L432KC, Cortex-M4). Also flashed by hand, not by CI. Serial1
; is USART1, whose first entry in the variant's PinMap_UART_TX/RX is PA9/PA10 — the Arduino
; header's D1 and D0. The console stays on USART2, which is wired to the ST-LINK VCP, so the
; KNX line and the debug output do not share pins. ENABLE_HWSERIAL1 is load-bearing: without
; it STM32duino declares Serial1 but never defines it, and the build fails at link.
[env:nucleo_l432kc]
platform = ststm32
board = nucleo_l432kc
framework = arduino
build_flags = -DENABLE_HWSERIAL1
monitor_speed = 115200

; Fourth bench board (Raspberry Pi Pico 2, RP2350). Flashed by hand, not by CI — the compile-only
; [env:pico] below already covers this core family. Serial1 is UART0 on GP0/GP1. The RP2350 sets
; ARDUINO_ARCH_RP2040 like its predecessor, so KNX_DEFAULT_PORT still resolves; a board that
; dropped that macro would silently lose the address-only constructor.
[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; Host environment for unit-testing the Arduino-free protocol core (KnxCommon + KnxValue).
; Run with: pio test -e native
[env:native]
lib_deps =
platform = native
test_framework = unity
build_flags = -std=c++14
; src/ is now the library itself (no main.cpp/entry point), and `pio test` does not build
; src/ by default. Without this, none of the KnxCoordinator/KnxFrame/... symbols the test/
; files reference would be compiled in.
test_build_src = true
; KnxDriver is Arduino-only (target-only per CLAUDE.md's architecture table) and is not
; included by any test file or by any other compiled unit here. test_build_src compiles
; every .cpp in src/ unconditionally, so without this filter the native build fails on
; KnxDriver.cpp's `#include <Arduino.h>`.
build_src_filter = +<*> -<KnxDriver.cpp>

; ---------------------------------------------------------------------------------------
; Portability envs — one per Arduino core family, compile-only, never flashed from here.
; They exist so `ci.yml` can prove the library still builds everywhere after a driver
; change. Nothing builds them by default (`default_envs` above pins the firmware env).
;
; Point them at a sketch rather than src/ when checking the examples, e.g.
;   PLATFORMIO_SRC_DIR=examples/DeviceObject pio run -e megaatmega2560
; ---------------------------------------------------------------------------------------

; AVR, classic core — the family with a free Serial1.
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; AVR, single UART — has no KNX_DEFAULT_PORT, so only the explicit-port sketch builds here.
; That is the point of the env: it proves the address-only constructor is correctly absent.
[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Renesas RA4M1 core.
[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino

; STM32duino core — a different core from the Giga's mbed one, on the same silicon vendor.
; ENABLE_HWSERIAL1 is what makes the core actually instantiate Serial1; without it the
; symbol is declared but never defined, and KNX_DEFAULT_PORT correctly stays unset.
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino
build_flags = -DENABLE_HWSERIAL1

; RP2040 with the Earle Philhower core (SerialUART : HardwareSerial). The official
; raspberrypi platform ships only the mbed core and ignores board_build.core, so this
; needs the community fork that carries both.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; A second ESP32 variant: no XIAO pin aliases, and native USB CDC on boot.
[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Arduino's mbed core (ArduinoCore-API) — the family the Nano 33, Portenta and SAMD share.
[env:giga_r1_m7]
platform = ststm32
board = giga_r1_m7
framework = arduino
