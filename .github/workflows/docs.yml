name: Publish docs

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual publish from the Actions tab, for getting documentation live between releases.
  # It deploys whatever ref you pick, so the site can then be ahead of the newest tag.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag, VERSION, and library.properties agree
        run: |
          set -euo pipefail
          FILE_VERSION="$(cat VERSION)"

          # Only a tag run has a version to agree with. A manual run publishes a ref that is
          # deliberately ahead of the newest tag, so the comparison is skipped there — the
          # library.properties check below still runs, because it must never drift from VERSION.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
              echo "::error::tag v$TAG_VERSION does not match VERSION file ($FILE_VERSION)"
              exit 1
            fi
          else
            echo "manual run on ${GITHUB_REF_NAME} — no tag to compare, publishing VERSION $FILE_VERSION"
          fi

          LP_VERSION="$(grep '^version=' library.properties | cut -d= -f2)"
          if [ "$LP_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::library.properties version ($LP_VERSION) does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi

          echo "All versions agree: $FILE_VERSION"

  test:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pio
      - run: pio test -e native

  build:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pio
      - run: PLATFORMIO_SRC_DIR=examples/BenchTest pio run -e seeed_xiao_esp32c6

  docs:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Doxygen 1.17.0
        run: |
          set -euo pipefail
          curl -fsSL -o doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz
          tar xzf doxygen.tar.gz
          DOXYGEN_BIN="$(find "$PWD" -maxdepth 3 -type f -name doxygen -perm -u+x | head -n1)"
          if [ -z "$DOXYGEN_BIN" ]; then
            echo "::error::doxygen binary not found after extracting archive"
            exit 1
          fi
          dirname "$DOXYGEN_BIN" >> "$GITHUB_PATH"

      - name: Generate docs
        run: doxygen Doxyfile

      - name: Fail if Doxygen emitted warnings
        run: |
          if [ -s doxygen/warnings.txt ]; then
            echo "::error::doxygen/warnings.txt is non-empty:"
            cat doxygen/warnings.txt
            exit 1
          fi
          echo "warnings.txt is empty, as required"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: doxygen/html

      - uses: actions/deploy-pages@v5
        id: deployment
